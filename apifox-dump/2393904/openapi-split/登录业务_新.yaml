  /v2/public/login/remote/etaxcookie#398473365:
    post:
      summary: 发送短信验证码
      operationId: api-398473365
      tags:
      - 登录业务（新） / 登录管理 / 验证码登录
      description: |
        ##  接口描述
        该接口用于用户使用手机号触发税局下发的验证码。
        支持企业登录和代理登录，「登录方式」使用 14：企业业务登录（自传验证码）15：代理业务登录（自传验证码）。
      parameters:
      - name: access_token
        in: header
        required: false
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                aggOrgId:
                  type: integer
                  title: 企业Id
                accountId:
                  type: string
                  title: 账户id
                  description: 多账号时必传
              x-apifox-orders:
              - aggOrgId
              - accountId
              required:
              - aggOrgId
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
