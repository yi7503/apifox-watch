      description: |-
        ##  接口描述
        该接口用于用户手机接收到税局下发的验证码，进行上传完成最终登录。
        - 说明
        1. 登录发送短信验证码后返回taskid，并且发送短信到用户手机号上，2分钟内不允许重复登录发送验证码，重复发送会提示「短信频繁」；
        2. 上传短信验证码，5分钟内上传短信有效，超出时限会提示「登录任务已过期」，此时需要重新登录发送验证码；
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrsbh:
                  type: string
                  title: 纳税人识别号
                taskId:
                  type: string
                  title: 异步登录税局【发送短信验证码】的返回值
                smsCode:
                  type: string
                  title: 短信验证码
              x-apifox-orders:
              - taskId
              - nsrsbh
              - smsCode
              required:
              - taskId
              - nsrsbh
              - smsCode
            examples:
              example_0:
                summary: ''
                value: null
