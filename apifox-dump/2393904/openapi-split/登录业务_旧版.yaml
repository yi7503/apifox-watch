  /v2/public/login/multiacc/dpptCookie:
    post:
      summary: 登录税局发送短信验证码
      operationId: api-132698553
      tags:
      - 登录业务（旧版） / 自持模式登录 / 多账号管理 / 账密登录
      description: "##  接口描述\n\n该接口用于36个地区税局的新版登录，如果税局登录需要短信验证码登录，则触发短信发送。 \n\n ps：相同的个人用户+不同身份类型 在税局是互踢。建议的最优使用方案是不同个人用户+身份类型。\n  敏感信息支持加密，详见body参数说明，加密参见：[加密说明](doc-3774763)\n  备注：\n1、目前该接口已经支持升级为“增强版”模式，有意向合作的客户可以发送邮件申请（mous@qixiangyun.com）；\n2、同一个区域同一个自然人只能存在一个有效登录，请您知晓同一个自然人在同一个税号下的不同身份也是无法同时登录的；\n3、敏感信息传递支持内容加密，详见接口body参数说明，加密见：加密说明"
      parameters:
      - name: access_token
        in: header
        required: true
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: |
          待签名字符串 = HTTPMethod + "_" + Content-Md5 + "_" + req_date + "_" + access_token + "_" + AppSecret
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrsbh:
                  type: string
                  title: 纳税人识别号
                  description: 该值必填
                areaCode:
                  type: string
                  title: 地区编码
                  description: 四川传值5100，青岛为3702。该值必填
                gryhm:
                  type: string
                  title: 用户名
                  description: 可为：居民身份证/手机号/用户名。该值必填
                gryhmm:
                  type: string
                  title: 个人用户密码
                  description: 该值必填 需要RSA加密
                sflx:
                  type: string
                  title: 身份类型
                  description: 参见附录身份类型
                sjhm:
                  type: string
                  title: 手机号码
                  description: 该值必填
                type:
                  type: string
                  description: 默认全部，1表示tpass ，2表示etax，3表示dppt.支持多个组合：如1,2,3
                  title: 登录cooki类型
              x-apifox-orders:
              - nsrsbh
              - areaCode
              - gryhm
              - gryhmm
              - sflx
              - sjhm
              - type
              required:
              - nsrsbh
              - areaCode
              - gryhm
              - gryhmm
              - sflx
              - sjhm
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                x-apifox-refs:
                  01GW14PXT5M6CPA7QN31MEE9HS:
                    $ref: '#/definitions/35327531'
                    x-apifox-overrides:
                      data:
                        type: object
                        properties:
                          dppt:
                            type: object
                            properties:
                              cookie:
                                type: string
                                title: 登录税局成功的cookie值
                            x-apifox-orders:
                            - cookie
                            required:
                            - cookie
                            title: 登录数字账户信息
                          taskId:
                            type: string
                            title: 发送短信成功的id，推送短信接口的传参
                          accountId:
                            type: string
                            title: 账户唯一标识
                            description: 多账户业务需要要传入
                          individualId:
                            type: string
                            title: 自然人唯一标识
                          etax:
                            type: object
                            properties:
                              cookie:
                                type: string
                                title: cookie
                            x-apifox-orders:
                            - cookie
                            title: etax
                            required:
                            - cookie
                          tpass:
                            type: object
                            properties:
                              cookie:
                                type: string
                                title: cookie
                            x-apifox-orders:
                            - cookie
                            required:
                            - cookie
                            title: tpass
                        title: 业务数据
                        description: 当code为2000，从data获取任务id或者登录结果
                        x-apifox-orders:
                        - dppt
                        - etax
                        - tpass
                        - taskId
                        - accountId
                        - individualId
                        required:
                        - etax
                        - tpass
                      code:
                        type:
                        - string
                        - 'null'
                        title: 登录返回的code
                        description: 2000：登录成功；4xxx;登录信息有误;8xxx短信发送频繁；5xxx:系统错误
                      message:
                        type: string
                        title: 错误信息
                    required:
                    - code
                x-apifox-orders:
                - 01GW14PXT5M6CPA7QN31MEE9HS
                properties: {}
              examples:
                发送短信成功结果示例:
                  summary: 发送短信成功结果示例
                  value:
                    req_id: 0f1fe24daa164e95b0191f80a2bf11fc
                    success: true
                    code: '2000'
                    data:
                      individualId: f7d90cd33fed9c9e0c5ad324e64dda52
                      accountId: 836f8e89a726d14d4d1bd9e93b0fb946
                      taskId: 1736647432086679600
                异常示例:
