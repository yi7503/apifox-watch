  /v2/public/account/create:
    post:
      summary: 托管账号创建
      operationId: api-134743646
      tags:
      - 登录业务（旧版） / 托管模式登录 / 多账号管理 / 账号管理
      description: |-
        ## 接口描述
         该接口用于税局已注册的登录账号信息在平台侧进行创建维护和修改。
        1. 适用于使用多账号的场景, 多账号典型场景例如“多开票员”, 以及同一个用户账号多身份类型, 既有“开票员”又有“办税员”两个角色, 其中办税员身份可以做申报、发票勾选认证等, 开票员只可做开票业务;
        2. 如果您的应用场景明确有多种角色, 或者一个人有多个手机号码，请使用此接口进行账号的创建;


        :::info[]
        #### 「登录方式」9：企业业务登录（需使用办税小号） 14：企业业务登录（自传验证码）15：代理业务登录（办税小号或自传验证码）
          **以下每种登录方式字段均为必填：**
        9：企业id，登录方式，个人用户名（需传办税小号）， [身份类型](doc-4553802)，个人用户密码，手机号码（需传办税小号）；
        14：企业id，登录方式，个人用户名， [身份类型](doc-4553802)，个人用户密码，手机号码；
        15：企业id（被代理企业），登录方式，代理机构税号，个人用户名， [身份类型](doc-4553802)，个人用户密码，手机号码
               **代理登录的账密是指登录代理机构的账密**
        :::




         #### 「对照税局登录页面」

        ![image.png](https://api.apifox.com/api/v1/projects/2393904/resources/573261/image-preview)
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gryhm:
                  type: string
                  title: 个人用户名
                  description: dlfs=9时需传办税小号；dlfs=14或15时，可为身份证号/手机号码/用户名，建议统一用手机号码；
                dlmm:
                  type: string
                  title: 登录密码
                  description: RSA加密
                  deprecated: true
                gryhmm:
                  type: string
                  title: 个人用户密码
                  description: 需RSA加密，[加密说明](apifox://link/pages/3774763)
                dlzh:
                  type: string
                  title: 登录账户
                  deprecated: true
                dlfs:
                  type: integer
                  title: 登录方式
                  enum:
                  - 9
                  - 14
                  - 15
                  x-apifox-enum:
                  - value: 9
                    name: 企业业务登录
                    description: 需使用办税小号
                  - value: 14
                    name: 企业业务登录
                    description: 自传验证码
                  - value: 15
                    name: 代理业务登录
                    description: 办税小号或自传验证码
                sflx:
                  type: string
                  title: 身份类型
                  description: 见附录：[身份类型](apifox://link/pages/4553802)
                aggOrgId:
                  type: integer
                  title: 企业id
                dq:
                  type: integer
                  title: 地区
                  description: 税号所在地区，见附录：[地区代码](apifox://link/pages/2246773)
                  examples:
                  - 11
                sjhm:
                  type: string
                  title: 手机号码
                  description: dlfs=9时需传办税小号
                loginType:
                  type: integer
                  title: 特定主体标识
                  description: 1表示特定主体
                specType:
                  type: integer
                  description: 2 跨区税源登记纳税人 「当前只支持2」
                  title: 特定主体类型
                proxyNsrsbh:
                  type: string
                  title: 代理机构税号
                  description: 代理登录 dlfs=15时，必填
              required:
              - dlfs
              - aggOrgId
              - dq
              - sjhm
              - gryhm
              - gryhmm
              - sflx
              x-apifox-orders:
              - aggOrgId
              - dq
              - dlfs
              - gryhm
              - gryhmm
              - sflx
              - sjhm
              - proxyNsrsbh
              - loginType
              - specType
              - dlmm
              - dlzh
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    title: 错误码
                    description: 错误码
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      accountId:
                        type: integer
                        title: 账户ID
                    x-apifox-orders:
                    - accountId
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type: string
                    title: 错误信息
                  reqId:
                    type: string
                    title: 请求ID
                    description: 由服务器端生成的唯一标识，对应每次请求。排
