        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  title: 异步登录税局【发送短信验证码】的返回值
                smsCode:
                  type: string
                  title: 税短信验证码
              x-apifox-orders:
              - taskId
              - smsCode
              required:
              - taskId
              - smsCode
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                x-apifox-refs: {}
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                properties:
                  code:
                    type:
                    - string
                    - 'null'
                    title: 登录返回的code
                    description: 2000：登录成功；4xxx;登录信息有误;8xxx短信发送频繁；5xxx:系统错误
                  success:
                    description: 接口是否成功（是否发生业务异常）
                    type: boolean
                    title: 是否成功标记
                  reqId:
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                    type: string
                    title: 请求id
                  message:
                    type: string
                    title: 错误信息
                required:
                - code
                - success
                - reqId
              examples:
                登录成功示例:
                  summary: 登录成功示例
