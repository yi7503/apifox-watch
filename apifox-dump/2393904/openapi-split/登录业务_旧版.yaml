          content:
            application/json:
              schema:
                type: object
                x-apifox-refs:
                  01GW14PXT5M6CPA7QN31MEE9HS:
                    $ref: '#/definitions/35327531'
                    x-apifox-overrides:
                      data:
                        type:
                        - boolean
