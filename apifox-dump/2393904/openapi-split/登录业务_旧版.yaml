  /v2/public/login/ext/checkAsyncLoginSjCache#91708966:
    post:
      summary: 校验税局缓存是否有效
      operationId: api-91708966
      tags:
      - 登录业务（旧版） / 自持模式登录 / 单账号登录 / 账密登录
      description: |-
        ##  接口描述

        该接口用于36个地区的异步登录成功后，缓存的dppt cookie是否有效。
           支持加密参见：[加密说明](doc-3774763)
      parameters:
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrsbh:
                  type: string
                  title: 纳税人识别号
                  description: 该值必填
                areaCode:
                  type: string
                  title: 地区编码
                  description: 四川传值5100，青岛为3702。该值必填
                gryhm:
