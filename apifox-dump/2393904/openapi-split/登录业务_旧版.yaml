  /v2/public/login/ext/etaxpushsms#91546280:
    post:
      summary: 登录税局上传短信验证码
      operationId: api-91546280
      tags:
      - 登录业务（旧版） / 自持模式登录 / 单账号登录 / 账密登录
      description: |-
        ##  接口描述
        该接口用于用户手机接收到税局下发的验证码，进行上传完成最终登录。
        - 说明
        1. 登录发送短信验证码后返回taskid，并且发送短信到用户手机号上，2分钟内不允许重复登录发送验证码，重复发送会提示「短信频繁」；
        2. 上传短信验证码，5分钟内上传短信有效，超出时限会提示「登录任务已过期」，此时需要重新登录发送验证码；
      parameters:
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
