      description: "##  接口描述\n\n该接口用于36个地区新版电子税局登录和新版电票平台登录。如税局登录需要短信验证码登录，则触发短信发送。 \n 敏感信息支持加密，详见body参数说明，加密参见：[加密说明](doc-3774763)\n备注：\n1、目前该接口已经支持升级为“增强版”模式，有意向合作的客户可以发送邮件申请（mous@qixiangyun.com）；\n2、同一个区域同一个自然人只能存在一个有效登录，请您知晓同一个自然人在同一个税号下的不同身份也是无法同时登录的；\n3、敏感信息传递支持内容加密，详见接口body参数说明，加密见：加密说明"
      parameters:
