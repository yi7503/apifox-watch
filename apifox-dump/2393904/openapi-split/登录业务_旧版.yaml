  /v2/public/account/createBaseAccount:
    post:
      summary: 通用账号创建/修改
      operationId: api-149415738
      tags:
      - 登录业务（旧版） / 托管模式登录 / 单账号登录 / 账号管理
      description: |+
        ## 接口描述

        该接口用于税局已注册的登录账号信息在平台侧进行创建维护和修改。
        1. 适用于不需要使用多账号的场景, 多账号典型场景例如“多开票员”, 以及同一个用户账号多身份类型, 既有“开票员”又有“办税员”两个角色, 其中办税员身份可以做申报、发票勾选认证等, 开票员只可做开票业务;
        2. 如果您的应用场景明确有多种角色, 或者一个人有多个手机号码，请使用[托管账号创建](api-134743646)进行创建;


        :::info[]
        #### 「登录方式」9：企业业务登录（需使用办税小号） 14：企业业务登录（自传验证码）15：代理业务登录（办税小号或自传验证码）
          **以下每种登录方式字段均为必填：**
        9：企业id，登录方式，个人用户名（需传办税小号）， [身份类型](doc-4553802)，个人用户密码，手机号码（需传办税小号）；
        14：企业id，登录方式，个人用户名， [身份类型](doc-4553802)，个人用户密码，手机号码；
        15：企业id（被代理企业），登录方式，代理机构税号，个人用户名， [身份类型](doc-4553802)，个人用户密码，手机号码
               **代理登录的账密是指登录代理机构的账密**
        :::

        #### 「对照税局登录页面」

        ![image.png](https://api.apifox.com/api/v1/projects/2393904/resources/573261/image-preview)

      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gryhm:
                  type: string
                  title: 个人用户名
                  description: dlfs=9时需传办税小号；dlfs=14或15时，可为身份证号/手机号码/用户名，建议统一用手机号码；
                dlmm:
                  type: string
                  title: 登录密码
                  description: 需要RSA加密
                  deprecated: true
                gryhmm:
                  type: string
                  title: 个人用户密码
                  description: 需RSA加密，[加密说明](apifox://link/pages/3774763)
                dlzh:
                  type: string
                  title: 登录账号
                  deprecated: true
                dlfs:
                  type: integer
                  title: 登录方式
                  enum:
                  - 9
                  - 14
                  - 15
                  x-apifox-enum:
                  - value: 9
                    name: 企业业务登录
                    description: 需使用办税小号
                  - value: 14
                    name: 企业业务登录
                    description: 自传验证码
                  - value: 15
                    name: 代理业务登录
                    description: 办税小号或自传验证码
                sflx:
                  type: string
                  title: 身份类型
                  description: 见附录：[身份类型](apifox://link/pages/4553802)
                aggOrgId:
                  type: integer
                  title: 企业id
                sjhm:
                  type: string
                  title: 手机号码
                  description: dlfs=9时需传办税小号
                proxyNsrsbh:
                  type: string
                  title: 代理机构税号
                  description: 代理登录 dlfs=15时，必填
              required:
              - dlfs
              - aggOrgId
              - sjhm
              - gryhm
              - gryhmm
              - sflx
              x-apifox-orders:
              - aggOrgId
              - dlfs
              - gryhm
              - gryhmm
              - sflx
              - sjhm
              - proxyNsrsbh
              - dlmm
              - dlzh
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    title: 错误码
                    description: 错误码
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      accountId:
                        type: integer
                        title: 账户ID
                    x-apifox-orders:
                    - accountId
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type: string
                    title: 错误信息
                  reqId:
                    type: string
                    title: 请求ID
                    description: 由服务器端生成的唯一标识，对应每次请求。排
                required:
                - code
                - success
                - message
                - reqId
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    data:
                      dlmm: +mjI3liekvY=
                      sflx: KPY
                      dq: '11'
                      accountId: 504325035988992
                      gryhm: '13466759052'
                      nsrsbh: 91110108MA01BW7XXU
                      createTime: '2023-12-19 14:24:24'
                      gryhmm: G1I7fmzpN7qrlfFDGc71Vw==
                      dlzh: dlzh1004
                      appKey: 10001999
                      dlfs: 9
                      aggOrgId: 7583454730897015
                      state: 1
                    success: true
                    message: ''
                    reqId: 1f4bf3651c734b94b08daaed42408ef0
                异常示例:
                  summary: 异常示例
                  value:
                    code: PARAMETER_ERROR
                    success: true
                    message: 没有找到对应的企业！
                    reqId: 3dc1baad8e424bb29af85e1a364c7e74
                未登录:
                  summary: 未登录
                  value:
                    reqId: 0516f06b781b4590a23de8b7b148a853
                    code: '40100'
                    success: false
                    message: 未登录!
  /v2/public/login/scanLogin/getQrcode:
    post:
      summary: 获取登录税局二维码
      operationId: api-150925060
      tags:
      - 登录业务（旧版） / 自持模式登录 / 单账号登录 / 扫码登录
      description: |-
        ##  接口描述

        该接口用于获取登录税局二维码，用户可以通过扫描该二维码进行税局登录。
        二维码有效时长为300s,请在到期前生成并扫码登录
      parameters:
      - name: access_token
        in: header
        required: true
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: |
          待签名字符串 = HTTPMethod + "_" + Content-Md5 + "_" + req_date + "_" + access_token + "_" + AppSecret
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                areaCode:
                  type: string
                nsrsbh:
                  type: string
              required:
              - areaCode
              x-apifox-orders:
              - areaCode
              - nsrsbh
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    title: 错误码
                    description: 2000：登录成功；4xxx;登录信息有误;8xxx短信发送频繁；5xxx:系统错误
                  data:
                    type: object
                    properties:
                      qrcode:
                        type: string
                        title: 二维码字符串
                        description: 二维码有效时长为300s,请在到期前生成并扫码登录
                      taskId:
                        type: integer
                        description: 扫码获取成功的任务id，推送短信接口的传参
                        title: 任务id
                      qrcodeId:
                        type: string
                        title: 二维码id
                    required:
                    - qrcode
                    - taskId
                    - qrcodeId
                    x-apifox-orders:
                    - qrcode
                    - taskId
                    - qrcodeId
                  success:
                    type: boolean
                    title: 是否成功标记
                  message:
                    type: string
                    title: 错误信息
                  reqId:
                    type: string
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                    title: 请求ID
                required:
                - code
                - data
                - success
                - message
                - reqId
                x-apifox-orders:
                - code
                - data
                - success
                - message
                - reqId
              examples:
                成功结果示例:
                  summary: 成功结果示例
                  value:
                    code: '2000'
                    data:
                      qrcode: qrcode_id=GdNBgdu+m19PQ/b6uzodwMXUKF4PhpaEXBUCuRU8rLoFAdAvmDp7i7Yobk7zzkNM&areaPrefix=5100&interfaceCode=0003
                      taskId: 1762794678531752000
                      qrcodeId: be2ba2a0d8444fabbec65a43486cc5ed
                    success: true
                    message: 获取二维码成功
                    reqId: e3b34e6154d248f6b713d7fdb3377a4a
                异常示例:
                  summary: 异常示例
                  value:
                    req_id: b58c2ab8200c4e77b3fbe6f9d32fc3af
                    success: true
                    code: '4000'
                    data: ''
                    message: 参数nsrsbh不能为空！
