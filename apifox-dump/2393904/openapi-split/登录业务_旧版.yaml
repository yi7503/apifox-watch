  /v2/public/login/ext/checkAsyncLoginSjCache:
    post:
      summary: 校验税局缓存是否有效
      operationId: api-188602936
      tags:
      - 登录业务（旧版） / 自持模式登录 / 单账号登录 / 税务APP登录
      description: |-
        ##  接口描述

        该接口用于36个地区的异步登录成功后，缓存的税局cookie是否有效。
           支持加密参见：[加密说明](doc-3774763)
      parameters:
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrsbh:
                  type: string
                  title: 纳税人识别号
                  description: ，该值必填
                areaCode:
                  type: string
                  title: 地区编码
                  description: 四川传值5100，青岛为3702。该值必填
                gryhm:
                  type: string
                  title: 用户名
                  description: 可为：居民身份证/手机号/用户名。该值必填
                gryhmm:
                  type: string
                  title: 个人用户密码
                  description: 该值必填，当encryptionType=1时该值必须加密
                sflx:
                  type: string
                  title: 身份类型
                  description: 参见附录身份类型
                sjhm:
                  type: string
                  title: 手机号码
                  description: 除广东、天津、浙江、湖北外，该值必填
                encryptionType:
                  type: string
                  description: ' 1表示加密,默认0不加密'
                  title: 加密类型
                isOnlyCheckCache:
                  type: integer
                  title: 只检测缓存标识
                  description: 1表示只检查缓存不再尝试登录
                proxyNsrsbh:
                  type: string
                  title: 代理机构税号，如果是代理企业该字段必传
              x-apifox-orders:
              - encryptionType
              - nsrsbh
              - areaCode
              - gryhm
              - gryhmm
              - sflx
              - sjhm
              - isOnlyCheckCache
              - proxyNsrsbh
              required:
              - encryptionType
              - nsrsbh
              - areaCode
              - gryhm
              - gryhmm
              - sflx
              - sjhm
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                x-apifox-refs:
                  01GW14PXT5M6CPA7QN31MEE9HS:
                    $ref: '#/definitions/35327531'
                    x-apifox-overrides:
                      data:
                        type:
                        - boolean
                        - 'null'
                        title: 返回结果
                        description: true为缓存有效；false缓存失效
                      code:
                        type:
                        - string
                        - 'null'
                        title: 错误码
                        description: 2000：接口成功；4xxx;登录信息有误；5xxx:系统错误
                      success:
                        description: 接口是否成功（是否发生业务异常）
                        type: boolean
                        title: 是否成功标记
                      message:
                        type: string
                        title: 错误信息
                    required:
                    - code
                    - success
                x-apifox-orders:
                - 01GW14PXT5M6CPA7QN31MEE9HS
                properties: {}
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    data: true
                    success: true
                    message: ''
                    reqId: d8e97e6e88514e329f28386d2d07f6f0
                异常示例:
                  summary: 异常示例
                  value:
                    code: '4000'
                    success: true
                    message: 参数gryhm不能为空！
                    reqId: 8b2991d73f924e85994670564975aa42
  /v2/public/login/multiacc/dpptCookie#193453624:
    post:
      summary: 登录税局发送短信验证码
      operationId: api-193453624
      tags:
      - 登录业务（旧版） / 自持模式登录 / 多账号管理 / 税务APP登录
      description: "##  接口描述\n\n该接口用于36个地区税局的新版登录，如果税局登录需要短信验证码登录，则触发短信发送。 \n\n ps：相同的个人用户+不同身份类型 在税局是互踢。建议的最优使用方案是不同个人用户+身份类型。\n  敏感信息支持加密，详见body参数说明，加密参见：[加密说明](doc-3774763)\n  备注：\n1、目前该接口已经支持升级为“增强版”模式，有意向合作的客户可以发送邮件申请（mous@qixiangyun.com）；\n2、同一个区域同一个自然人只能存在一个有效登录，请您知晓同一个自然人在同一个税号下的不同身份也是无法同时登录的；\n3、敏感信息传递支持内容加密，详见接口body参数说明，加密见：加密说明"
      parameters:
      - name: access_token
        in: header
        required: true
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: |
          待签名字符串 = HTTPMethod + "_" + Content-Md5 + "_" + req_date + "_" + access_token + "_" + AppSecret
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrsbh:
                  type: string
                  title: 纳税人识别号
                  description: 该值必填
                areaCode:
                  type: string
                  title: 地区编码
                  description: 四川传值5100，青岛为3702。该值必填
                gryhm:
                  type: string
                  title: 用户名
                  description: 可为：居民身份证/手机号/用户名。该值必填
                gryhmm:
                  type: string
                  title: 个人用户密码
                  description: 该值必填 需要RSA加密
                sflx:
                  type: string
                  title: 身份类型
                  description: 参见附录身份类型
                sjhm:
                  type: string
                  title: 手机号码
                  description: 该值必填
              x-apifox-orders:
              - nsrsbh
              - areaCode
              - gryhm
              - gryhmm
              - sflx
              - sjhm
              required:
              - nsrsbh
              - areaCode
              - gryhm
              - gryhmm
              - sflx
              - sjhm
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                x-apifox-refs:
                  01GW14PXT5M6CPA7QN31MEE9HS:
                    $ref: '#/definitions/35327531'
                    x-apifox-overrides:
                      data:
                        type: object
                        properties:
                          dppt:
                            type: object
                            properties:
                              cookie:
                                type: string
                                title: 登录税局成功的cookie值
                            x-apifox-orders:
                            - cookie
                            required:
                            - cookie
                            title: 登录数字账户信息
                          taskId:
                            type: string
                            title: 发送短信成功的id，推送短信接口的传参
                          accountId:
                            type: string
                            title: 账户唯一标识
                            description: 多账户业务需要要传入
                          individualId:
                            type: string
                            title: 自然人唯一标识
                          tpass:
                            type: object
                            properties:
                              cookie:
                                type: string
                                title: cookie
                            x-apifox-orders:
                            - cookie
                            required:
                            - cookie
                            title: tpass
                          etax:
                            type: object
                            properties:
                              cookie:
                                type: string
                                title: cookie
                            x-apifox-orders:
                            - cookie
                            title: etax
                            required:
                            - cookie
                        title: 业务数据
                        description: 当code为2000，从data获取任务id或者登录结果
                        x-apifox-orders:
                        - dppt
                        - tpass
                        - etax
