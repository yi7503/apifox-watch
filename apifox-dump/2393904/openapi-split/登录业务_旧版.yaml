  /v2/public/login/ext/uploadToken:
    post:
      summary: 上传Cookie接口
      operationId: api-146705335
      tags:
      - 登录业务（旧版） / 自持模式登录 / 单账号登录 / 会话登录
      description: |-
        ##  接口描述

        用于用户自行登录获取税局Cookie后，通过该接口直接上传税局有效Cookie进行登录。
        2,3 类型只支持办税员管理业务
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: false
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        description: 当前时间转为的毫秒数
        schema:
          type: string
