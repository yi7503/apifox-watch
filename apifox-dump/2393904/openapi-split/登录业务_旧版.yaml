paths:
  /v2/bsrygl/qy/addBsyTask:
    post:
      summary: 企业添加办税人员任务
      operationId: api-120194407
      tags:
      - 登录业务（旧版） / 办税人员管理 / 企业侧
      description: |
        企业添加办税人员任务:
        code码为4928 ，需要客户发起获取获取二维码任务，扫脸确认后，进行二维码确认状态,再发起任务
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                zrrList:
                  type: array
                  items:
                    type: object
                    properties:
                      yxqz:
                        type: string
                        title: 有效期止
                        description: yyyy-MM-dd
                      zrrxm:
                        type: string
                        title: 自然人姓名
                      zjlx:
                        type: string
                        title: 证件类型
                        description: 只能填写201（身份证）
                      sflx:
                        type: string
                        title: 身份类型
                      zjhm:
                        type: string
                        title: 身份证号码
                    x-apifox-orders:
                    - zrrxm
                    - zjlx
                    - sflx
                    - zjhm
                    - yxqz
                    required:
                    - zrrxm
                    - zjlx
                    - sflx
                    - zjhm
                aggOrgId:
                  type: integer
                  title: 企业ID
                  description: 非上传cookie的客户必填
                accountId:
                  type: string
                  title: 登录账户唯一标识
              required:
              - zrrList
              x-apifox-orders:
              - aggOrgId
              - accountId
              - zrrList
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    title: 错误码
                    description: '错误码 '
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                        title: 任务ID
                    required:
                    - taskId
                    x-apifox-orders:
                    - taskId
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type: string
                    title: 错误信息
                  reqId:
                    type: string
                    title: 请求ID
                    description: 由服务器端生成的唯一标识，对应每次请求。排
                required:
                - code
                - data
                - success
                - message
                - reqId
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    data:
                      taskId: 494950194417664
                    success: true
                    message: ''
                    reqId: 9e39c2456fed470eb56215559e139089
                异常示例:
                  summary: 异常示例
                  value:
                    code: PARAMETER_ERROR
                    success: true
                    message: 身份证号已存在
                    reqId: 0e01a588abf44c2aacbb17b9d28cb5f6
