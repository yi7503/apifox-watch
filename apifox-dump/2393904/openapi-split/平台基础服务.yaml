                      message: |-
                        尊敬的纳税人缴费人：
                        为保障业务可靠性，国家税务总局广东省税务局将于9月25日23:00至次日03:00、9月27日23:00至次日03:00 更新网络设备。更新期间网络可能会中断，影响门户网站、电子发票、电子税务局等相关互联网业务办理，请各位纳税人缴费人合理安排办税（费）、开票时间。
                        感谢广大纳税人缴费人对税收工作的理解与支持，给您带来不便，敬请谅解。
                         
                        国家税务总局广东省税务局
                        2024年9月24日
                      module: ''
