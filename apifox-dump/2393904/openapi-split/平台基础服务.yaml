                              description: 默认全部
                              enum:
                              - 0
                              - 1
                              x-apifox-enum:
                              - value: 0
                                name: '电子税局 '
                                description: ''
                              - value: 1
                                name: '电票平台 '
                                description: ''
                            message:
                              type: string
                              title: 消息内容
                            module:
                              type: string
                              title: 业务模块
                            noticeType:
                              type: integer
                              title: 通知类别
                              enum:
                              - 10
                              - 20
                              - 30
                              - 31
                              - 40
                              - 41
                              x-apifox-enum:
