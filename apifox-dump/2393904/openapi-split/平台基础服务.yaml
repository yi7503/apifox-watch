                      threshold: ''
                      title: 平台维护通知
                    - area: '3300'
                      contentType: 0
                      createTime: '2024-09-23 17:06:14'
                      message: |-
                        尊敬的缴费人：
                        为进一步提升社保费缴费服务水平，提高系统运行效率，国家税务总局山东省税务局将于2024年9月23日（周一）20:00至9月24日（周二）7:00进行社保费相关系统停机升级工作。期间，山东省电子税务局、社保费管理客户端、微信社保费缴纳小程序、支付宝社保费缴纳、自助办税终端、银行各缴费渠道、“爱山东”移动端等社保费缴纳相关功能暂停使用。
                        感谢广大缴费人的理解和支持，对此带来的不便敬请谅解。
                        国家税务总局山东省税务局
                        2024年9月23日
                      module: ''
                      noticeType: 20
                      threshold: ''
                      title: 平台维护通知
                查验异常通知示例:
                  summary: 查验异常通知示例
                  value:
                    reqId: d46686f25cc6476aa90e95c839a3ee52
