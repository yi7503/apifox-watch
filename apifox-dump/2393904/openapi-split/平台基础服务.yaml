paths:
  /v2/subscribe/sysmessage/getNoticeMessage:
    post:
      summary: 服务异常通知
      operationId: api-145706545
      tags:
      - 平台基础服务 / 平台通知预警
      description: |-
        该接口通过订阅消息，可以支持服务异常通知、税局变化通知、税局升级通知的获取，方便客户系统集成和实时提醒。
        - 接口调用方式：客户定时轮询接口获取消息。
        - 本接口支持增量数据拉取，支持获取一个月内全量数据
      parameters:
      - name: access_token
        in: header
        required: false
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  title: 操作类型
                  default: notice
                data:
                  type: object
                  properties:
                    noticeType:
                      type: integer
                      title: 通知类型
                      description: 不填写：所有类型通知
                      enum:
                      - 10
                      - 20
                      - 30
                      - 31
                      - 40
                      - 41
                      x-apifox-enum:
                      - value: 10
                        name: 平台维护通知
                        description: ''
                      - value: 20
                        name: 税局维护通知
                        description: ''
                      - value: 30
                        name: 税局异常通知
                        description: ''
                      - value: 31
                        name: 税局恢复通知
                        description: ''
                      - value: 40
                        name: 查验异常通知
                        description: ''
                      - value: 41
                        name: 查验恢复通知
                        description: ''
                    area:
                      type: string
                      title: 地区
                      description: 见附录：[地区代码](apifox://link/pages/2246773)
                    contentType:
                      type: string
                      title: 平台类型
                      description: 默认全部
                      enum:
                      - '0'
                      - '1'
                      x-apifox-enum:
                      - value: '0'
                        name: '电子税局 '
                        description: ''
                      - value: '1'
                        name: ' 电票平台 '
                        description: ''
                    acceptType:
                      type: string
                      title: 增量全量标志
                      description: 默认是1-增量
                      enum:
                      - '0'
                      - '1'
                      x-apifox-enum:
                      - value: '0'
                        name: 全量
                        description: 一个月时间内
                      - value: '1'
                        name: 增量
                        description: 已读的不再发送
                  x-apifox-orders:
                  - noticeType
                  - area
                  - contentType
                  - acceptType
              x-apifox-orders:
              - action
              - data
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apifox-orders:
                - 01J8KGKEQTAY1FD99N7QEMBGJR
                x-apifox-refs:
                  01J8KGKEQTAY1FD99N7QEMBGJR:
                    $ref: '#/definitions/35327531'
                    x-apifox-overrides:
                      data:
                        type:
                        - array
                        - 'null'
                        items:
