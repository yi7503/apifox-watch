  /CALLBACKURL:
    post:
      summary: 配置公共回调地址
      operationId: api-430772849
      tags:
      - 平台基础服务 / 平台公共回调
      description: |-
        发起业务后需要回调拿到结果的，目前通过联系技术支持配置回调地址。
        目前是每个产品可以配置一个回调地址
        回调策略：
        1.第一次回调成功后不再发起回调
        2.第一次不成功，10s后再发起一次回调，不成功则30s后再发起回调，目前是重试3次，加上第一次回调失败一共会推送4次

        个税/社保产品回调报文
        {
            "msg":"success",
            "taskStatus":3,
            "taskId":"5151471684213235391"
        }
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      - name: access_token
        in: header
        required: false
        schema:
          type: string
      - name: req_date
        in: header
        required: false
        schema:
          type: string
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    title: 一定要返回字符串2000
                    description: 返回字符串2000的会认为是成功
                  msg:
                    type: string
                    title: 返回消息说明
                    description: '"成功"'
                x-apifox-orders:
                - code
                - msg
                required:
                - code
                - msg
              examples:
                示例 1:
                  summary: 示例 1
                  value:
                    code: '2000'
                    msg: 成功
      x-apifox-status: released
