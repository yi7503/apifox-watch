openapi: 3.0.3
info:
  title: 七翔云开放平台 — 快速开始
  version: latest
  description: 'Split from full spec, module: 快速开始'
tags:
- name: 快速开始 / 文件预上传
paths:
  /v2/oauth2/oss/getAccessKey:
    post:
      summary: 文件上传凭证获取
      operationId: api-518887307
      tags:
      - 快速开始 / 文件预上传
      description: 用于获取**阿里云 OSS 临时上传凭证（STS）**。客户端拿到凭证后，可直接向 OSS 上传文件（用于业务传输文件使用），无需经过我方服务器中转，上传速度与稳定性更好。
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fileSuffix:
                  type: string
                  title: 文件后缀名
                  description: 文件后缀名，字母/数字 1~8 位，可带或不带点，如 pdf、.xlsx
              x-apifox-orders:
              - fileSuffix
              required:
              - fileSuffix
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                    title: 请求id
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                  code:
                    type:
                    - string
                    - 'null'
                    title: 错误码
                    examples:
                    - SUCCESS
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type:
                    - string
                    - 'null'
                    title: 错误信息
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      accessKeyId:
                        type: string
                        description: STS 临时凭证三元组，用于构造 OSS 客户端
                        title: accessKeyId
                      accessKeySecret:
                        type: string
                        description: STS 临时凭证三元组，用于构造 OSS 客户端
                        title: accessKeySecret
                      securityToken:
                        type: string
                        description: STS 临时凭证三元组，用于构造 OSS 客户端
                        title: securityToken
                      bucketName:
                        type: string
                        description: 目标桶
                        title: 目标桶
                      endPoint:
                        type: string
                        description: endPoint
                        title: 端点
                      region:
                        type: string
                        description: 地域信息
                        title: 地域
                      expiration:
                        type: string
                        title: 过期时间
                      objectKey:
                        type: string
                        description: 本次唯一允许上传的对象 key；
                        title: 上传对象key值
                    x-apifox-orders:
                    - accessKeyId
                    - accessKeySecret
                    - securityToken
                    - bucketName
                    - endPoint
                    - region
                    - expiration
                    - objectKey
                    title: 业务数据
                    required:
                    - accessKeySecret
                    - accessKeyId
                    - securityToken
                    - bucketName
                    - endPoint
                    - region
                    - expiration
                    - objectKey
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
                required:
                - reqId
                - success
                - code
                - message
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    success: true
                    message: null
                    data:
                      accessKeyId: STS.NYaGQdN***********33Pa4dvoyC
                      accessKeySecret: 3gxctNQs9V***********YJ9FoNCwkQhbKmPiRmpSdd7
                      securityToken: CAISqAR1q6***********vQo4527qiKQEzD1zMFbbtImarSoTz2IHh...
                      bucketName: custom-file-upload
                      endPoint: oss-cn-beijing.aliyuncs.com
                      region: cn-beijing
                      expiration: '2026-09-22T07:11:45Z'
                      objectKey: custom/{appkey}/2bacdfdc3e344ebbbbd4ce88add8cb41.pdf
                    reqId: 0cca7ae7-56ed-4718-bd8a-505c8493ca96
      x-apifox-status: released
