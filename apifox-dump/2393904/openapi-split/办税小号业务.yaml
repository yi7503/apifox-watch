  /v2/public/sjhm/bindAxn:
    post:
      summary: 绑定实名手机号与办税小号
      operationId: api-88235964
      tags:
      - 办税小号业务 / 小号管理
      description: |-
        ## 接口描述

        该接口用于实名手机号与办税小号绑定，呼叫办税小号时呼叫转移至实名手机号。

        ## 错误码
        | 错误代码            | 错误消息                                                     | 状态码 |
        | ------------------- | ------------------------------------------------------------ | ------ |
        | PARAMETER_ERROR | 无效的手机号或固定电话（固定电话需要加区号，区号和号码中间不需要加连字符） phoneNoA，请检查手机号或固定电话格式是否正确 | 无     |
        | PARAMETER_ERROR | 无效的办税小号 phoneNoX ，请检查办税小号格式是否正确！       | 无     |
        | PARAMETER_ERROR | 实名手机号 phoneNoA与号码池key为poolKey 的办税小号 phoneNoX 绑定失败！ | 无     |
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: false
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: false
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNoA:
                  type: string
                  title: 实名手机号
                  description: 实名手机号（可设置为手机号码或固定电话，固定电话需要加区号，区号和号码中间不需要加连字符。）
                phoneNoX:
                  type: string
                  title: 办税小号
              x-apifox-orders:
              - phoneNoA
              - phoneNoX
              required:
              - phoneNoA
              - phoneNoX
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type:
                    - string
                    - 'null'
                    title: 错误码
                    description: 错误码
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type:
                    - string
                    - 'null'
                    title: 错误信息
                    description: 错误信息
                  reqId:
                    type: string
                    title: 请求id
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                  data:
                    type:
                    - object
                    - 'null'
                    properties: {}
                    description: 绑定成功返回的绑定关系Id
                    x-apifox-orders: []
                required:
                - code
                - success
                - message
                - reqId
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    reqId: 915c51ddb1674f2caf982e30db8815a6
                    code: SUCCESS
                    success: true
                    message: ''
                    data: '1000050000736099'
                失败示例:
                  summary: 失败示例
                  value:
                    reqId: 915c51ddb1674f2caf982e30db8815a6
                    code: PARAMETER_ERROR
                    success: false
                    message: 传入参数不能为空！
  /v2/public/sjhm/updateNoA:
    post:
      summary: 更换绑定的实名手机号
      operationId: api-88238191
      tags:
      - 办税小号业务 / 小号管理
      description: |-
        ## 接口描述

        该接口用于更换与办税小号绑定的实名手机号，呼叫办税小号时呼叫转移至实名手机号。

        ## 错误码
        | 错误代码               | 错误消息                                                     | 状态码 |
        | ---------------------- | ------------------------------------------------------------ | ------ |
        | PARAMETER_ERROR    | 无效的办税小号phoneNoX ，请检查办税小号格式是否正确！        | 无     |
        | PARAMETER_ERROR    | 无效的手机号或固定电话（固定电话需要加区号，区号和号码中间不需要加连字符）phoneNoA，请检查手机号或固定电话格式是否正确 | 无     |
        | PARAMETER_ERROR    | 号码池key为 poolKey 的办税小号 phoneNoX 绑定关系已更新，更新后的实名手机号为phoneNoA，绑定id为subsId | 无     |
        | PARAMETER_ERROR    | 号码池key为poolKey 的办税小号phoneNoX 更新绑定的实名手机号phoneNoA失败！ | 无     |
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: false
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: false
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNoA:
                  type: string
                  title: 实名手机号
                  description: 要换绑为的实名手机号（可设置为手机号码或固定电话，固定电话需要加区号，区号和号码中间不需要加连字符。）
                phoneNoX:
                  type: string
                  title: 办税小号
                  description: 办税小号
                oldNoA:
                  type: string
                  title: 旧的实名手机号
                  description: 旧的实名手机号
              x-apifox-orders:
              - oldNoA
              - phoneNoA
              - phoneNoX
              required:
              - phoneNoA
              - phoneNoX
              - oldNoA
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type:
                    - string
                    - 'null'
                    title: 错误码
                    description: 错误码
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type:
                    - string
                    - 'null'
                    title: 错误信息
                    description: 错误信息
                  reqId:
                    type: string
                    title: 请求id
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                  data:
                    type:
                    - object
                    - 'null'
                    properties: {}
                    description: 实名手机号更换结果，true成功，false失败
                    x-apifox-orders: []
                required:
                - code
                - success
                - message
                - reqId
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    reqId: 55a0b9c64e3c4792a9b026b306dd53a1
                    code: SUCCESS
                    success: true
                    message: ''
                    data: true
                失败示例:
                  summary: 失败示例
                  value:
                    reqId: 9292b64c0b034134bd89de8d0753b06d
                    code: PARAMETER_ERROR
                    success: false
                    message: 传入的参数-原来的实体手机号phoneNoA不能为空！
