  /客户提供的小号短信通知地址:
    post:
      summary: 小号短信通知回调
      operationId: api-91843602
      tags:
      - 办税小号业务 / 短信管理
      description: |-
        ## 前提条件
        1、客户添加应用时需设置短信通知接收地址，并确保提供的地址能够正常处理平台发送的通知消息。如果需要开启短信通知功能，请通过配置短信通知地址配置短信接受地址。

        ## 接口描述
        此接口向客户推送办税小号的短信通知。 客户收到通知后返回HTTP状态码为200的空消息即可。

        ## 返回结果
        客户服务器接收到短信事件通知后，返回无消息体的200响应

        ## 响应示例：
        HTTP/1.1 200 OK
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: false
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: false
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: false
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                callId:
                  type: string
                  title: 短信唯一标识
                sender:
                  type: string
                  title: 短信的发送人
                  description: 一般指当地税局的号码，例如：10690510000000562537
                receiver:
                  type: string
                  title: 短信的接收人，即办税小号
                smsContent:
                  type: string
                  title: 短信内容
                receiveTime:
                  type: string
                  title: 短信收到的时间
                  description: 格式为yyyy-MM-dd HH:mm:ss
                pushTime:
                  type: string
                  title: 短信推送给客户的时间
                  description: 格式为yyyy-MM-dd HH:mm:ss
              x-apifox-orders:
              - callId
              - sender
              - receiver
              - smsContent
              - receiveTime
              - pushTime
              required:
              - callId
              - sender
              - receiver
              - smsContent
              - receiveTime
              - pushTime
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apifox-orders: []
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    message: 成功
                失败示例:
                  summary: 失败示例
                  value:
                    reqId: 915c51ddb1674f2caf982e30db8815a6
                    code: PARAMETER_ERROR
                    success: false
                    message: 传入参数不能为空！
