  /地址联系技术支持配置#228628751:
    post:
      summary: 获取采集状态-回调通知
      operationId: api-228628751
      tags: []
      description: |-
        描述：采集任务完成时回调通知客户。
        调用流程：
        1. 客户提供自己的接口回调地址；
        2. 发起企业数据采集，采集完成后会推送数据到回调地址，客户返回成功响应；
        3. 判断采集状态是否完成，获取status状态；
        4. 获取结果，当采集状态为3时采集完成，调用获取全量数据接口获取数据；

        客户回调返回查看响应参数及示例
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      - name: access_token
        in: header
        required: false
        schema:
          type: string
      - name: req_date
        in: header
        required: false
        schema:
          type: string
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: -1：任务创建失败，0:无任务，1:进行中，3:完成
                  title: 任务完成状态
                statusMsg:
                  type: string
                  title: 任务完成状态描述
                  description: 任务完成状态描述
                statusDetails:
                  type: object
                  properties:
                    main:
                      type: string
                      title: 分组总状态
                      description: 1：进行中，2：失败（任一失败），3：成功
                    sb、fp、jcxx、syhq:
                      type:
                      - object
                      - 'null'
                      properties:
                        status:
                          type: string
                          title: 分组任务处理状态
                          description: 1：进行中，2：失败，3：成功
                        loginCode:
                          type: string
                          title: 子任务登录失效状态码
                          description: 8000：存在登录失效任务，2000：全部成功，5000：部分失败
                      x-apifox-orders:
                      - status
                      - loginCode
                      title: 分组任务状态详情节点
                    mainStatusCode:
                      type: string
                      title: 分组总code
                      description: 8000：存在登录失效任务，2000：全部成功，5000：部分失败
                  x-apifox-orders:
                  - sb、fp、jcxx、syhq
                  - main
                  - mainStatusCode
                  title: 任务状态详情
                  required:
                  - mainStatusCode
                  - main
                taskId:
                  type: string
                  description: 任务ID
                  title: 任务ID
              required:
              - taskId
              - status
              - statusDetails
              x-apifox-orders:
              - taskId
              - status
              - statusMsg
              - statusDetails
              x-apifox-refs: {}
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 接收响应Code
                  msg:
                    type: string
                    description: 接收响应消息
                x-apifox-orders:
                - code
                - msg
                required:
                - code
                - msg
              examples:
                成功返回结果:
                  summary: 成功返回结果
                  value:
                    code: '2000'
                    msg: 已接收
