  /v2/collect/beginFinTask#170674874:
    post:
      summary: 发起企业数据采集
      operationId: api-170674874
      tags: []
      description: |-
        该接口用于发起企业数据采集（需区分自持和托管）：
        1. 自持账号模式下：自行异步登录后再调用该接口；
        2. 托管模式下：传入账号必要信息直接调用。


        | **错误代码** | **错误信息**  | **解决方案**|
        | --- | --- |---|
        | 2000 | 成功 | |
        | 4xxx| 获取失败 | |
      parameters:
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              x-apifox-refs:
                01HV0TJ5317Q3J9WJ7Z3ZJ5B6F:
                  $ref: '#/definitions/86364451'
                  x-apifox-overrides:
                    filter: null
                    reqType: null
                    aggOrgId: null
                    collectCycle: null
                    accountId: null
              x-apifox-orders:
              - 01HV0TJ5317Q3J9WJ7Z3ZJ5B6F
              properties: {}
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
