paths:
  /v2/collect/getTaxAndFpInfo:
    post:
      summary: 获取采集状态及全量数据
      operationId: api-167844361
      tags: []
      description: |
        描述：该接口用于获取采集状态及税务和发票信息数据
        注：发票数据量会过多一个月发票明细返回一个joson进行整体压缩，返回压缩文件文件进行加密，解密方式参考附录示例

        调用流程：
        1. 通过发起采集任务时返回的taskId，轮询该接口的状态；
        2. 判断采集状态是否完成，获取data节点下的status状态；
        3. 获取结果，当采集状态为3时采集完成，获取result节点下的数据；


        | **错误代码** | **错误信息**  | **解决方案**|
        | --- | --- |---|
        | 2000 | 成功 | |
        | 5000 | 异常 | |
      parameters:
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  title: 任务id
                  description: 任务成功后任务ID
                  x-apifox-mock: '1698948417616556034'
                nsrsbh:
                  type: string
                  title: 纳税人识别号
                  description: 纳税人识别号
                  x-apifox-mock: 91440111MACHRDGB9W
              x-apifox-orders:
              - taskId
              - nsrsbh
              x-apifox-refs: {}
              required:
              - taskId
              - nsrsbh
            examples:
              example_0:
                summary: ''
                value: null
