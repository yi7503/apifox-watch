          application/xml:
            schema:
              type: object
              properties: {}
              xml:
                name: business
              x-apifox-orders: []
              x-apifox-refs: {}
            examples:
              example_0:
                summary: ''
                value: null
              示例 1:
                summary: 示例 1
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 相应返回信息
                  code:
                    type: string
                    description: 响应返回码 如：0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          title: 分类ID
                        categoryName:
                          type: string
                          title: 分类名称
                        parentId:
                          type: string
                          title: 父分类ID，当分类的parentId=0表示当前分类为一级分类
                        children:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                title: 分类ID
                              categoryName:
                                type: string
                                title: 分类名称
                              updateTime:
                                type: string
                                title: 更新日期
                                description: yyyy/mm/dd hh:mm:ss
                            required:
                            - id
                            - categoryName
                            - updateTime
                            x-apifox-orders:
                            - id
                            - categoryName
                            - updateTime
