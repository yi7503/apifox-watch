                      id: '1354569356436642304'
                      title: 国家税务总局关于中国华融资产管理股份有限公司和中国东方资产管理公司企业所得税征管问题的公告
                      summary: 根据2025.03.24 国家税务总局令第59号《国家税务总局关于公布废止和修改的部分税务部门规章及规范性文件目录的决定》，本文第三条及附件自2025年3月24日起废止。
                      categoryId: '4'
                      categoryName: 税务法规-中央税法
                      documentNumber: 国家税务总局公告2013年第38号
                      documentIssuingAgency: 国家税务总局
                      publicationTime: '2013-07-09'
                      periodStartDate: 2013/07/09
                      periodEndDate: 2099/12/31
                      effective: 部分失效
                      tax: 企业所得税
                      industry: 全部行业
                      area: 全国适用
                      content: |
                        <font color="red">　　注释：根据2025.03.24 <a href="workbench/policy/detail?docNum=国家税务总局令第59号">国家税务总局令第59号</a>《国家税务总局关于公布废止和修改的部分税务部门规章及规范性文件目录的决定》，本文第三条及附件自2025年3月24日起废止。<hr style="height:1px;border:none;border-top:1px dashed #0066cc;"><br></font>　　《财政部、国家税务总局、中国人民银行关于明确中国邮政储蓄银行等企业所得税收入归属的通知》（财预〔2013〕34号）规定，中国华融资产管理股份有限公司、中国东方资产管理公司缴纳的企业所得税为中央收入，全部缴入中央国库。根据《国家税务总局关于中国工商银行股份有限公司等企业企业所得税有关征管问题的通知》（<a href="workbench/policy/detail?docNum=国税函〔2010〕184号">国税函〔2010〕184号</a>）精神，现将中国华融资产管理股份有限公司和中国东方资产管理公司企业所得税征管问题公告如下： <p></p>　　一、中国华融资产管理股份有限公司、中国东方资产管理公司应缴纳的企业所得税，由企业总机构统一汇总计算后，向总机构所在地主管税务机关申报预缴，年终进行汇算清缴。上述企业所属二级分支机构应按照企业所得税的有关规定，向其当地主管税务机关报送企业所得税预缴申报表和其他相关资料，各分支机构不就地预缴企业所得税。 <p></p>　　二、中国华融资产管理股份有限公司、中国东方资产管理公司及其所属分支机构发生的资产损失，按照《国家税务总局关于发布〈企业资产损失所得税税前扣除管理办法〉的公告》（<a href="workbench/policy/detail?docNum=国家税务总局公告2011年第25号">国家税务总局公告2011年第25号</a>）的规定办理。 <p></p>　　<font color="#666666">三、中国华融资产管理股份有限公司、中国东方资产管理公司所属二级分支机构名单由国家税务总局公布。上述企业所属二级以下（不含）分支机构名单，由二级分支机构向所在地主管税务机关提供，经所在地省税务机关审核后公布。企业分支机构发生增减变化的，应及时上报国家税务总局及二级分支机构所在地主管税务机关，由国家税务总局和二级分支机构所在地省税务机关重新公布所属分支机构名单。</font><br><font color="red">　　【注释：根据2025.03.24 <a href="workbench/policy/detail?docNum=国家税务总局令第59号">国家税务总局令第59号</a>《国家税务总局关于公布废止和修改的部分税务部门规章及规范性文件目录的决定》，本条规定自2025年3月24日起废止。】</font><br>
                         <p></p>　　四、本公告自2013年1月1日起执行。 <p></p>　　特此公告。 <p></p><font color="blue">　　<b>附：国家税务总局关于《中国华融资产管理股份有限公司和中国东方资产管理公司企业所得税征管问题的公告》的解读</b></font><p></p>　　根据《国家税务总局关于印发〈跨地区经营汇总纳税企业所得税征收管理暂行办法〉的通知》（<a href="workbench/policy/detail?docNum=国税发〔2008〕28号">国税发〔2008〕28号</a>）规定，《国家税务总局关于中国工商银行股份有限公司等企业企业所得税有关征管问题的通知》（<a href="workbench/policy/detail?docNum=国税函〔2010〕184号">国税函〔2010〕184号</a>）明确了中国工商银行股份有限公司等企业所得税收入全额归属中央的企业由总机构统一计算并缴纳企业所得税，分支机构不实行就地预缴的征管办法，并由总局发布各企业所属二级分支机构名单。《财政部 国家税务总局 中国人民银行关于明确中国邮政储蓄银行等企业所得税收入归属的通知》（财预[2013]34号）明确，中国华融资产管理股份有限公司和中国东方资产管理公司缴纳的企业所得税为中央收入，全部缴入中央国库。为保持企业所得税收入全额归属中央的企业征管政策的一致性，便于中国华融资产管理股份有限公司和中国东方资产管理公司所属二级分支机构所在地税务机关对其所属二级分支机构的管理，参照<a href="workbench/policy/detail?docNum=国税函〔2010〕184号">国税函〔2010〕184号</a>文件的规定，明确了这两户企业的所得税征管办法。同时公布其所属二级分支机构名单。<p></p>
