                      required:
                      - id
                      - categoryName
                      - parentId
                      - children
                      x-apifox-orders:
                      - id
                      - categoryName
                      - parentId
                      - children
                    title: 响应数据
                  reqId:
                    type: string
                    title: 请求唯一ID
                required:
