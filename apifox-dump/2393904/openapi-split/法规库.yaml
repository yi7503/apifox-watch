                - message
                - code
                - reqId
                x-apifox-orders:
                - data
                - message
                - code
                - reqId
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    data:
                    - id: '1'
                      categoryName: 税务法规
                      parentId: '0'
                      children:
                      - id: '4'
                        categoryName: 中央税法
                        updateTime: '2025-05-15 12:34:56'
                      - id: '5'
                        categoryName: 地方税法
                        updateTime: '2025-05-15 12:34:56'
                    - id: '24'
                      categoryName: 财经法规
                      parentId: '0'
                      children:
                      - id: '25'
                        categoryName: 金融证券
                        updateTime: '2025-05-15 12:34:56'
                      - id: '26'
                        categoryName: 财政法规
                        updateTime: '2025-05-15 12:34:56'
                    reqId: 7eeae4c409ec404eab3d7908c64e9fd3
                    message: 成功
                    code: '0'
