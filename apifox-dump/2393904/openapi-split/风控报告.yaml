openapi: 3.0.3
info:
  title: 七翔云开放平台 — 风控报告
  version: latest
  description: 'Split from full spec, module: 风控报告'
tags:
- name: 风控报告
paths:
  /v2/risk/rpt/apply:
    post:
      summary: 风控报告申请
      operationId: api-414729059
      tags:
      - 风控报告
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      - name: access_token
        in: header
        required: false
        schema:
          type: string
      - name: req_date
        in: header
        required: false
        schema:
          type: string
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrmc:
                  type: string
                  title: 企业名称
                nsrsbh:
                  type: string
                  title: 企业税号
                areaCode:
                  type: string
                  title: 所属区域码
                  description: 参考申请地区码
                rptType:
                  type: string
                  title: 报告格式
                  description: 1 pdf链接 2 json
                aggOrgId:
                  type: string
                  title: 企业id
                accountId:
                  type: string
                  title: 登录账号id
                sqInfo:
                  type: string
                  title: 授权书pdf文件的base64字符串
              required:
              - nsrmc
              - nsrsbh
              - areaCode
              - rptType
              - accountId
              - aggOrgId
              - sqInfo
              x-apifox-orders:
              - nsrmc
              - nsrsbh
              - areaCode
              - rptType
              - aggOrgId
              - accountId
              - sqInfo
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                    title: 请求id
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                  code:
                    type:
                    - string
                    - 'null'
                    title: 错误码
                    examples:
                    - SUCCESS
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type:
                    - string
                    - 'null'
                    title: 错误信息
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      riskRptId:
                        type:
                        - integer
                        - 'null'
                        title: 报告id
                        description: 报告id，用于后面该id调用报告结果查询接口获取报告结果
                    x-apifox-orders:
                    - riskRptId
                    title: 业务数据
                    required:
                    - riskRptId
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
                required:
                - reqId
                - success
                - code
                - message
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    success: true
                    message: null
                    data:
                      riskRptId: '5255567414997147791'
                    timestamp: '2026-02-03 16:08:24'
                    reqId: T2e01022b737d42008775b0184fb63281
  /v2/risk/rpt/queryResult:
