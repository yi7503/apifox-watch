                    - rptJson
                    - rptUrls
                    - status
                    x-apifox-orders:
                    - message
                    - rptJson
                    - rptUrls
                    - status
                  timestamp:
                    type: string
                    title: 时间戳
                  reqId:
                    type: string
                    title: 请求id
                required:
                - code
                - success
                - message
                - data
                - timestamp
                - reqId
                x-apifox-orders:
                - code
                - success
                - message
                - data
                - timestamp
                - reqId
              examples:
                成功示例:
                  summary: 成功示例
                  value:
                    code: '2000'
                    success: true
                    message: null
                    data:
                      message: null
                      rptJson:
                        nsrsbh: '12345678910111'
                        dfx: 3
                        nsrmc: xxxxxxxxxxxxxxxxx
                        fxmxList:
                        - yjflDm: '01'
                          fxqq: '202402'
                          zcyj: |-
                            根据《中华人民共和国税收征收管理法》第二十五条规定，纳税人必须依照法律、行政法规规定或者税务机关依照法律、行政法规的规定确定的申报期限、申报内容如实办理纳税申报，报送纳税申报表、财务会计报表以及税务机关根据实际需要要求纳税人报送的其他纳税资料。
                            《增值税暂行条例》
                            第十条　下列项目的进项税额不得从销项税额中抵扣：
                            （一）用于简易计税方法计税项目、免征增值税项目、集体福利或者个人消费的购进货物、劳务、服务、无形资产和不动产；
                            （二）非正常损失的购进货物，以及相关的劳务和交通运输服务；
                            （三）非正常损失的在产品、产成品所耗用的购进货物（不包括固定资产）、劳务和交通运输服务；
                            （四）国务院规定的其他项目。
                          sjflDm: '010202'
                          fxms: 增值税进项税与销项税正常情况下变动趋势应当基本一致，若两者之间变动趋势严重不符，意味着企业的收入或成本存在异常，可能存在隐匿收入、虚增进项的风险。
                          zbdm: ZB010202000009
                          ejflDm: '0102'
                          fxqz: '202601'
                          yjflMc: 风险类
                          sjflMc: 销项税额风险
                          cljy: |-
                            1.风险核实及处理
                            （1）核实是否存在漏报未开票收入或视同销售未入账的行为。
                            （2）检查是否存在扩大抵扣范围的情况，如多抵扣了应作进项税额转出的发票（如非正常损失、简易计税项目对应的进项发票等）。
                            （3）核实是否抵扣了与主营业务无关的发票。
                            2.风险防范
                            （1）企业应建立健全的财务管理制度，完善的会计核算体系，确保准确核算各项税收数据。
                            （2）严格按照《中华人民共和国发票管理办法》的规定，合法取得和使用发票，确保进项税额的准确抵扣。
                          fxdjMc: 中风险
                          fxmc: 增值税进项税增长但销项税下降监控
                          ycqj: 202510-202510
                          ycxq: 根据该期间的数据分析结果显示，2025年10月进项税增长率为32.61%，销项税增长率为-51.74%，进项税与销项税增长趋势严重不符，存在隐匿收入、虚增进项、少缴增值税风险。
                          ejflMc: 增值税风险
                        gfx: 0
                        fxzs: 8
                        zfx: 5
                      rptUrls:
                      - https://yqzk.cssyq.com.cn/znfk/qyfxgl/saas/zsr/downloadBgPdf?path=qyfxgl/2026/02/03/c1182963345c4d588c1867802fe5076f/c1182963345c4d588c1867802fe5076f/*****************_20260203162800_05.pdf
                      status: 3
                    timestamp: '2026-02-03 16:32:43'
                    reqId: T7e1cf615f8974adc9********44
