      summary: 风控报告结果查询
      operationId: api-414735944
      tags:
      - 风控报告
      parameters:
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
      - name: access_token
        in: header
        required: false
        schema:
          type: string
      - name: req_date
        in: header
        required: false
        schema:
          type: string
      - name: req_sign
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                riskRptId:
                  type: string
                  title: 报告id
              required:
              - riskRptId
              x-apifox-orders:
              - riskRptId
            examples:
              示例 1:
                summary: 示例 1
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  success:
                    type: boolean
                  message:
                    type: 'null'
                  data:
                    type: object
                    properties:
                      message:
                        type: 'null'
                      rptJson:
                        type: object
                        properties:
                          nsrsbh:
                            type: string
                            title: 纳税人识别号
                          dfx:
                            type: integer
                            title: 低风险数
                          nsrmc:
                            type: string
                            title: 纳税人名称
                          fxmxList:
                            type: array
                            items:
                              type: object
                              properties:
                                yjflDm:
                                  type: string
                                  title: 一级分类代码
                                fxqq:
                                  type: string
                                  title: 分析期间起
                                zcyj:
                                  type: string
                                  title: 政策依据
                                sjflDm:
                                  type: string
                                  title: 三级分类代码
                                fxms:
                                  type: string
                                  title: 风险描述
                                zbdm:
                                  type: string
                                  title: 指标代码
                                ejflDm:
                                  type: string
                                  title: 二级分类代码
                                fxqz:
                                  type: string
                                  title: 分析期间至
                                yjflMc:
                                  type: string
                                  title: 一级分类名称
                                sjflMc:
                                  type: string
                                  title: 三级分类名称
                                cljy:
                                  type: string
                                  title: 应对方式
                                fxdjMc:
                                  type: string
                                  title: 风险等级
                                fxmc:
                                  type: string
                                  title: 风险名称
                                ycqj:
                                  type: string
                                  title: 异常期间
                                ycxq:
                                  type: string
                                  title: 异常详情
                                ejflMc:
                                  type: string
                                  title: 二级分类名称
                              x-apifox-orders:
                              - yjflDm
                              - yjflMc
                              - ejflDm
                              - ejflMc
                              - sjflDm
                              - sjflMc
                              - zbdm
                              - fxmc
                              - fxqq
                              - fxqz
                              - fxdjMc
                              - fxms
                              - zcyj
                              - cljy
                              - ycqj
