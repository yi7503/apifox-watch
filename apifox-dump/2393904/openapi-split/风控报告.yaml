                        - nsrmc
                        - fxzs
                        - gfx
                        - zfx
                        - dfx
                        - fxmxList
                        title: 报告的json格式内容
                        description: 当风险报告申请接口的入参rptType=1时，该字段为空
                      rptUrls:
                        type: array
                        items:
                          type: string
                        title: 报告的pdfurl信息
                        description: 当风险报告申请接口的入参rptType=2时，该字段为空
                      status:
                        type: integer
                        title: 报告生成状态
                        description: 1进行中，2生成失败 3 生成成功
