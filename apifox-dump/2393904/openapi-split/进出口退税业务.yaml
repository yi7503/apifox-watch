        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                aggOrgId:
                  type: string
                  title: 企业id
                taskId:
                  type: string
                  title: 任务id
              required:
              - aggOrgId
              - taskId
              x-apifox-orders:
              - aggOrgId
              - taskId
            examples:
              example_0:
                summary: ''
                value: null
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    title: 错误码
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        title: 业务code
                        description: 2000业务成功
                      businessStatus:
                        type: string
                        title: 任务执行状态
                        description: 1进行中，2 失败，3成功
                      message:
                        type: string
                        title: 信息
                    required:
                    - code
                    - businessStatus
                    - message
                    x-apifox-orders:
                    - code
                    - businessStatus
                    - message
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type: string
                    title: 错误码
                  reqId:
                    type: string
                    title: 请求id
                required:
                - code
                - data
                - success
                - message
                - reqId
                x-apifox-orders:
                - code
                - success
                - message
                - reqId
                - data
              examples:
                企业不存在:
                  summary: 企业不存在
                  value:
                    reqId: 807aa626b84b4e49ab0405dee305682d
                    code: PARAMETER_ERROR
                    success: true
                    message: 没有找到对应的企业！
                    data: null
                任务不存在:
                  summary: 任务不存在
                  value:
                    reqId: 489b28c74c0a4e8e94da5409c67818db
                    code: NO_RESULT
                    success: true
                    message: 查询无结果！
                    data: null
