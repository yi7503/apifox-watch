paths:
  /v2/ckts/selfCheck:
    post:
      summary: 出口退税申报自检任务发起
      operationId: api-304375029
      tags:
      - 进出口退税业务 / 出口退税申报 / 退税申报自检
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                aggOrgId:
                  type: string
                  title: 企业Id
                accountId:
                  type: string
                  title: 账号ID
                  description: 账号
                swjgdm:
                  type: string
                  title: 税务机关代码
                hgqyDm:
                  type: string
                  title: 海关企业代码
                ssyf:
                  type: string
                  title: 申报所属月份
                  description: 必传yyyyMM
                pc:
                  type: string
                  title: 批次号
                sbVersion:
                  type: string
                  title: 申报版本
                shVersion:
                  type: string
                  title: 审核版本
                cmVersion:
                  type: string
                  title: 编码库版本
                ywxx:
                  type: string
                  title: 业务报文
                  description: base64的业务xml  https://openapi.qixiangyun.com/doc-6799230
              required:
              - ssyf
              - aggOrgId
              - pc
              - ywxx
              - hgqyDm
              x-apifox-orders:
              - swjgdm
              - hgqyDm
              - ssyf
              - aggOrgId
              - accountId
              - pc
              - sbVersion
              - shVersion
              - cmVersion
              - ywxx
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type:
                - object
                - 'null'
                x-apifox-refs:
                  01GW664NTG8DAA40CQ3926Y530:
                    $ref: '#/definitions/35327531'
                    x-apifox-overrides:
                      data:
                        type: object
                        x-apifox-refs:
                          01JWX7QQGXX4YJKTV4NQFFAMKT:
                            $ref: '#/definitions/33757676'
                            x-apifox-overrides:
                              aggOrgId: null
                        x-apifox-orders:
                        - 01JWX7QQGXX4YJKTV4NQFFAMKT
                        properties: {}
                x-apifox-orders:
                - 01GW664NTG8DAA40CQ3926Y530
                properties: {}
