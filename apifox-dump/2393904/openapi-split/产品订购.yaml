                  code:
                    type:
                    - string
                    - 'null'
                    title: 错误码
                    examples:
                    - SUCCESS
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type:
                    - string
                    - 'null'
                    title: 错误信息
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      aggOrgId:
                        type: integer
                        title: 企业id
                      productCodeList:
                        type: string
                        title: 订购产品列表(英文逗号分隔)
                        description: 见附录：[产品码](apifox://link/pages/5110490)
                      nsrsbh:
                        type: string
                        title: 纳税人识别号
                      aggOrgName:
                        type: string
                        title: 企业名称
                      dq:
                        type: string
                        title: 地区码
                        description: 见附录：[地区代码](apifox://link/pages/2246773)
                    x-apifox-orders:
                    - nsrsbh
                    - aggOrgName
                    - productCodeList
                    - aggOrgId
                    - dq
                    title: 业务数据
                    required:
                    - aggOrgId
                    - productCodeList
                    - dq
                    - aggOrgName
                    - nsrsbh
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
                required:
                - reqId
                - success
                - code
                - message
              examples:
                订购返回示例:
                  summary: 订购返回示例
                  value: |-
                    {
                      "reqId": "c835d3478de34f17b479e269fe96c826",
                      "code": "SUCCESS",
                      "success": true,
                      "message": "",
                      "data": [
                        {
                          "aggOrgId": 5107*******5344,
                          "productCodeList": "0002,0003,0020,0021",
                          "nsrsbh":"C14078675F843****",
                          "aggOrgName":"压测企业C14078675F843****",
                          "dq":"6100"
                        }
                      ]
                    }
  /v2/public/org/productPurchaseModify:
    post:
      summary: 订购修改
      operationId: api-239363004
      tags:
      - 产品订购
      description: |
        ## 接口描述
        该接口用于修改已订购信息中的「企业名称」和「地区」。

        :::tip
        税号不支持修改，税号错误需调用 [企业取消授权](api-66706482) ，再重新调用 [订购产品](api-145565464)。
        :::



        ## 错误码
        | **错误代码** | **错误信息**  | **示例** | **解决方案** |
        | --- | --- | --- | --- |
        | PARAMETER_ERROR |企业Id(aggOrgId)不能为空！ | | |
        | PARAMETER_ERROR | 纳税人识别号(nsrsbh)不能为空！ | | |
        | PARAMETER_ERROR | 纳税人识别号只能包含数字和字母！ | | |
        | PARAMETER_ERROR | 纳税人识别号只能为15位、17位、18位或20位！ | | |
        | PARAMETER_ERROR | 企业纳税人识别号重复! | | |
        | PARAMETER_ERROR | 企业名称(aggOrgName)不能为空！ | | |
        | PARAMETER_ERROR | 企业名称重复! | | |
        | PARAMETER_ERROR | 地区编码有误，请根据地区编码附录中限定的编码传参 | | |
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
        example: application/json
      - name: access_token
        in: header
        required: true
        description: 通过调用access_token接口返回的access_token值
        schema:
          type: string
        example: '{{access_token}}'
      - name: req_date
        in: header
        required: true
        description: 当前时间转为的毫秒数
        schema:
          type: string
        example: '{{req_date}}'
      - name: req_sign
        in: header
        required: true
        description: 签名算法得到的签名
        schema:
          type: string
        example: '{{req_sign}}'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nsrsbh:
                  type:
                  - string
                  - 'null'
                  title: 税号
                  description: 税号不支持修改，税号错误需调用「企业取消授权」再重新订购
                  deprecated: true
                aggOrgName:
                  type: string
                  title: 企业名称
                dq:
                  type: string
                  title: 地区
                  examples:
                  - '31'
                  description: 见附录：[地区代码](apifox://link/pages/2246773)
                aggOrgId:
                  type: integer
                  title: 企业id
              x-apifox-orders:
              - aggOrgId
              - aggOrgName
              - dq
              - nsrsbh
              required:
              - aggOrgName
              - dq
              - aggOrgId
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  reqId:
                    type: string
                    title: 请求id
                    description: 由服务器端生成的唯一标识，对应每次请求。排查接口异常时，可提供该字段方便定位
                  code:
                    type:
                    - string
                    - 'null'
                    title: 错误码
                    examples:
                    - SUCCESS
                  success:
                    type: boolean
                    title: 是否成功标记
                    description: 接口是否成功（是否发生业务异常）
                  message:
                    type:
                    - string
                    - 'null'
                    title: 错误信息
                  data:
                    type:
                    - object
                    - 'null'
                    properties:
                      aggOrgId:
                        type:
                        - integer
                        - 'null'
                        title: 企业id
                      purchaseDetailList:
                        type:
                        - array
                        - 'null'
                        items:
                          type:
                          - object
                          - 'null'
                          properties:
                            productCode:
                              type:
                              - string
                              - 'null'
                              title: 产品码
                            success:
                              type:
                              - boolean
                              - 'null'
                              title: 订购成功标识
                            message:
                              type:
                              - string
                              - 'null'
                              title: 订购返回描述
                              description: 订购成功、订购失败、订购成功(已订购)
                          x-apifox-orders:
                          - productCode
                          - success
                          - message
                        title: 订购详情
                    x-apifox-orders:
                    - aggOrgId
                    - purchaseDetailList
                    title: 业务数据
                x-apifox-orders:
                - reqId
                - code
                - success
                - message
                - data
                required:
                - reqId
                - success
                - code
                - message
              examples:
                订购返回示例:
                  summary: 订购返回示例
                  value:
                    reqId: c835d3478de34f17b479e269fe96c826
                    code: SUCCESS
                    success: true
                    message: ''
                    data: null
  /v2/public/org/delete:
    post:
      summary: 企业取消授权
      operationId: api-66706482
      tags:
      - 产品订购
      description: |2

        ## 接口描述
        当与服务的企业客户解除合作关系（不再使用本平台接口）时，请调用该接口，删除该企业；
        - 删除后如需再次使用，需重新订购产品；

        ## 错误码

        | **错误代码** | **错误消息** |解决方案|
        | --- | --- |---|
        | PARAMETER_ERROR | 企业Id(aggOrgId)不能为空! |
        | PARAMETER_ERROR | 企业不存在！ |
        | PARAMETER_ERROR | 参数格式不合法,不是有效的json格式！ |
